[project]
name = "jobscope"
version = "0.1.0"
description = "Structured information extraction from job postings"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "requests>=2.32",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "ipykernel",
    "nbconvert",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobscope"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
